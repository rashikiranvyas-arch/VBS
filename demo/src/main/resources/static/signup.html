<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Banking System - Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2add32 0%, #2379cf 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 450px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2add32 0%, #2379cf 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }

        .header h1 {
            font-size: 28px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 35px 30px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #ddd;
            font-size: 14px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2379cf;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #2add32 0%, #23c9cf 100%);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .link a {
            color: #2379cf;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .message {
            display: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="header">
        <h1>VBS</h1>
        <p>Virtual Banking System</p>
    </div>

    <div class="content">
        <h2>Create Account</h2>

        <div id="signupMessage" class="message"></div>

        <form id="signupForm">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signupName" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="signupUsername" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword" required>
            </div>

            <div class="form-group">
                <label>Role</label>
                <select id="signupRole" required>
                    <option value="">Select Role</option>
                    <option value="customer">Customer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>

        <div class="link">
            Already have an account?
            <a onclick="location.href='login.html'">Login</a>
        </div>

        <div class="link">
            <a onclick="location.href='home.html'">← Back to Home</a>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById("signupForm");
    const messageBox = document.getElementById("signupMessage");

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const data = {
            name: signupName.value.trim(),
            username: signupUsername.value.trim(),
            email: signupEmail.value.trim(),
            password: signupPassword.value,
            role: signupRole.value
        };

        fetch("http://localhost:8081/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        })
            .then(res => res.text())
            .then(msg => {
                messageBox.style.display = "block";

                if (msg === "Successfully Registered") {
                    messageBox.className = "message success";
                    messageBox.innerText = "Account created successfully!";
                    setTimeout(() => location.href = "login.html", 1500);
                } else {
                    messageBox.className = "message error";
                    messageBox.innerText = msg;
                }
            })
            .catch(() => {
                messageBox.style.display = "block";
                messageBox.className = "message error";
                messageBox.innerText = "Server error. Try again later.";
            });
    });
</script>

</body>
</html>
